name: Platform checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.12'
            powershell: pwsh
          - os: windows-latest
            python: '3.9'
            powershell: powershell.exe
          - os: windows-latest
            python: '3.12'
            powershell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test installation and platform entry points
        env:
          HARNESS_TEST_POWERSHELL: ${{ matrix.powershell }}
        run: python -m unittest discover -s tests -v
      - name: Package clean source
        run: python scripts/package.py
      - name: Check whitespace
        run: git diff --check
