name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version and test
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected vMAJOR.MINOR.PATCH'
          assert Path('VERSION').read_text().strip() == tag, 'VERSION must match tag'
          PY
          sh -n install.sh
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Package clean tagged source
        run: python3 scripts/package.py
      - name: Publish four release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/workflow-harness-$RELEASE_TAG.tar.gz" \
            dist/install.sh dist/install.ps1 dist/SHA256SUMS \
            --verify-tag --title "Human Bottleneck $RELEASE_TAG" \
            --notes-file docs/release-notes.md
